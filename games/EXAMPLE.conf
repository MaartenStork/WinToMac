# Copy this to games/<slug>.conf and edit. Sourced as bash, so quote values.
#
# Finding the IDs: see docs/finding-ids.md

# Display name, used in the Steam appmanifest and in log output.
GAME_NAME="My Game"

# Steam application ID. On the store page URL: store.steampowered.com/app/<ID>/
STEAM_APPID=000000

# Depot and manifest to download. Both are required by `winmac fetch`.
# SteamDB lists them under the app's "Depots" tab. If you already have a
# partial install, appmanifest_<appid>.acf contains both.
STEAM_DEPOTID=000000
STEAM_MANIFESTID=0000000000000000000

# Folder name under steamapps/common, and the executable inside it.
# These must match exactly, including spaces and capitalisation.
GAME_DIR="My Game"
GAME_EXE="MyGame.exe"

# Which renderer path to use:
#
#   auto           same as mesa-llvmpipe. Start here.
#   mesa-llvmpipe  Mesa's OpenGL on the CPU. Slow but very reliable, and the
#                  only thing that works when Wine's macOS OpenGL driver
#                  cannot create a context. Lower the in-game render scale.
#   mesa-zink      Mesa's OpenGL on top of Vulkan/Metal. GPU accelerated when
#                  it works, but often fails with "No matching GL pixel
#                  format available" because of Mesa's WGL layer on Wine.
#   dxmt           For games that genuinely render with Direct3D 11. Sets
#                  SDL_RENDER_DRIVER=direct3d11 and relies on DXMT. Useless
#                  for games whose engine draws in OpenGL directly.
#   native         No override. Try this first on a hunch; if the game dies
#                  with a page fault at address 0, it needs Mesa.
#
# See docs/renderers.md for how to pick, and `winmac status` to verify.
RENDERER="auto"

# Optional per-application Windows version, e.g. winxp, win7, win10.
# Applies to this executable only. Some games want an older version for
# audio or input quirks. Leave empty unless you have a reason.
WINDOWS_VERSION=""

# Optional. Rasterizer threads for llvmpipe. Defaults to your performance
# core count. Lower it if audio crackles, since starved audio buffers are
# usually a symptom of every core being saturated.
LP_THREADS=""

# Optional extra environment variables, as "KEY=VALUE" strings.
EXTRA_ENV=()
