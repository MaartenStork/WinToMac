# Mewgenics — the game this pipeline was built and verified against.
#
# Verified on: MacBook Pro M4 Pro, macOS 26.5.2, Wine 11.0, Mesa 26.2.0.
#
# Renderer notes, learned the hard way:
#   - Wine's macOS OpenGL driver hands this game a NULL function pointer and
#     it dies with a page fault at address 0. RENDERER="native" does not work.
#   - mesa-zink loads and creates real VkDevices on the GPU, but SDL then
#     fails with "No matching GL pixel format available".
#   - dxmt does nothing here. The binary contains SDL3's D3D11 backend, but
#     the engine draws in OpenGL directly, so SDL_RENDER_DRIVER is ignored.
#     Verified with `winmac status`: 870% CPU, 0% GPU, libgallium_wgl loaded.
#   - mesa-llvmpipe works. It is CPU rendering, so lower the in-game render
#     scale to 70% or 50%. That is the single biggest speedup available.

GAME_NAME="Mewgenics"
STEAM_APPID=686060
STEAM_DEPOTID=686061
STEAM_MANIFESTID=8229879464648565847

GAME_DIR="Mewgenics"
GAME_EXE="Mewgenics.exe"

RENDERER="mesa-llvmpipe"

# Community reports say Windows XP mode fixes audio crackling on this title.
# Untested here: the crackling turned out to be CPU starvation from software
# rendering, which lowering the render scale addresses more directly.
WINDOWS_VERSION=""

LP_THREADS=""
EXTRA_ENV=()
